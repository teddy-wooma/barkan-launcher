appId: 'kr.barkan.launcher'
productName: 'Barkan Launcher'
artifactName: 'Barkan-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Barkan'

asar: true
# The resource pack is no longer bundled here - the launcher downloads the latest
# release on PLAY (see `resourcePack` in tools/build-distribution.cjs), which keeps
# the installer around 95 MB instead of 200 MB.
compression: 'maximum'

# Every runtime dependency of this launcher is pure JavaScript, so there is
# nothing to compile when packaging. Skipping the @electron/rebuild step makes
# the build faster and avoids requiring a full native toolchain.
npmRebuild: false

# 자동 업데이트. GitHub 릴리즈를 최신 버전 피드로 씁니다.
# 이 설정이 있으면 electron-builder 가 패키지 안에 app-update.yml 을,
# dist/ 안에 latest.yml 을 만듭니다. 런처는 실행할 때 latest.yml 을 읽어
# 최신 태그와 비교하고, 새 버전이 있으면 내려받아 설치합니다.
publish:
  provider: github
  owner: teddy-wooma
  repo: barkan-launcher
  # draft 가 아니라 바로 공개 릴리즈로 만듭니다.
  # (electron-builder 의 기본값이 draft 라서, 이 줄이 없으면 초안으로 남습니다)
  releaseType: release

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  # Development-only directories. `.npm-cache` and `.eb-cache` in particular are
  # large and must never end up inside the installer.
  - '!tools'
  - '!test'
  - '!.npm-cache'
  - '!.eb-cache'
  - '!.verify'
  - '!.userdata'
  - '!_branding-original'
  - '!_private'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  # 릴리즈 노트로 쓸 파일입니다. GitHub 릴리즈 본문에 그대로 들어갑니다.
  releaseInfo:
    releaseNotesFile: 'release-notes.md'

# Windows Installer Configuration
nsis:
  oneClick: false
  # 설치 관리자도 언어를 고르게 합니다. (설치 마법사의 버튼/문구만 바뀝니다.
  # 앱 자체의 언어는 첫 실행 때 따로 고릅니다)
  multiLanguageInstaller: true
  installerLanguages:
    - ko_KR
    - en_US
    - ja_JP
    - zh_CN
    - zh_TW
    - es_ES
    - pt_BR
    - fr_FR
    - de_DE
    - ru_RU
  # 사용자 폴더에 설치해 관리자 권한 요청(UAC) 창이 뜨지 않게 합니다.
  # (Program Files 에 설치하려면 perMachine: true 로 되돌려야 하고, 그때는 UAC 가 뜹니다)
  perMachine: false
  allowElevation: false
  # 설치 폴더를 고를 수 있게 두면 Program Files 를 선택해 다시 UAC 가 뜨므로 막습니다.
  allowToChangeInstallationDirectory: false
  shortcutName: '바르칸 열도 접속기'
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  # latest-mac.yml 에도 같은 릴리즈 노트를 넣습니다.
  releaseInfo:
    releaseNotesFile: 'release-notes.md'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Barkan'
  vendor: 'Barkan'
  synopsis: '바르칸 열도 마인크래프트 런처'
  description: '바르칸 열도 서버 전용 런처. 모드, 설정, 업데이트가 자동으로 관리됩니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
