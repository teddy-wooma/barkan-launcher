name: Release

# 푸시할 때마다 설치 파일을 만들고 릴리즈에 올립니다.
# 같은 버전이면 기존 릴리즈를 갱신하고, 버전을 올리면 새 릴리즈가 생깁니다.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "버전: $v"

      - name: Build installer
        run: npm run dist:win

      - name: Write checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist\Barkan-Launcher-setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "설치 파일을 찾지 못했습니다." }
          $line = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  " + $exe.Name
          Set-Content -Path "dist\SHA256SUMS.txt" -Value $line -Encoding utf8
          Write-Host $line

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"

          $assets = @()
          Get-ChildItem "dist\Barkan-Launcher-setup-*.exe" | ForEach-Object { $assets += $_.FullName }
          if (Test-Path "dist\SHA256SUMS.txt") { $assets += (Resolve-Path "dist\SHA256SUMS.txt").Path }
          if (Test-Path "dist\latest.yml")    { $assets += (Resolve-Path "dist\latest.yml").Path }
          $blockmap = Get-ChildItem "dist\*.exe.blockmap" -ErrorAction SilentlyContinue
          if ($blockmap) { $assets += $blockmap.FullName }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "기존 릴리즈를 갱신합니다: $tag"
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "새 릴리즈를 만듭니다: $tag"
            gh release create $tag @assets --title "바르칸 열도 접속기 $tag" --generate-notes
          }
