name: Release

# 푸시할 때마다 Windows 와 macOS 설치 파일을 만들어 릴리즈에 올립니다.
# 같은 버전이면 기존 릴리즈를 갱신하고, 버전을 올리면 새 릴리즈가 생깁니다.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      # 한쪽 플랫폼이 실패해도 다른 쪽은 계속 진행합니다.
      fail-fast: false
      # 두 플랫폼이 같은 릴리즈에 올리므로 동시에 실행하면 자산이 유실됩니다.
      # 순서대로 실행해 서로 덮어쓰지 않게 합니다.
      max-parallel: 1      matrix:
        include:
          - os: windows-latest
            flag: '-w'
          - os: macos-latest
            flag: '-m'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "버전: $v  (러너: ${{ runner.os }})"

      # 빌드와 발행을 electron-builder 에 맡깁니다.
      # 태그 생성, 릴리즈 생성, latest.yml / latest-mac.yml 첨부를 모두 처리합니다.
      # (GH_TOKEN 이 없으면 CI 를 감지해 발행하려다 실패합니다)
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- ${{ matrix.flag }} --publish always

      - name: Write checksums
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            $files = Get-ChildItem "dist/Barkan-Launcher-setup-*.exe"
            $name = "SHA256SUMS.txt"
          } else {
            $files = Get-ChildItem "dist/*.dmg"
            $name = "SHA256SUMS-macos.txt"
          }
          if (-not $files) { throw "설치 파일을 찾지 못했습니다." }
          $lines = @($files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name })
          Set-Content -Path "dist/$name" -Value $lines -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      # electron-builder 가 올리지 않는 것만 따로 첨부합니다.
      - name: Attach checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          $name = if ('${{ runner.os }}' -eq 'Windows') { "SHA256SUMS.txt" } else { "SHA256SUMS-macos.txt" }
          gh release upload $tag "dist/$name" --clobber
          Write-Host "--- 릴리즈 상태 ---"
          gh release view $tag