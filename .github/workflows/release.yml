name: Release

# 푸시할 때마다 설치 파일을 만들고 릴리즈에 올립니다.
# 같은 버전이면 기존 릴리즈를 갱신하고, 버전을 올리면 새 릴리즈가 생깁니다.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "버전: $v"

      # 빌드와 발행을 electron-builder 에 맡깁니다.
      # 태그 생성, 릴리즈 생성, latest.yml/blockmap 첨부를 모두 처리합니다.
      # (GH_TOKEN 이 없으면 CI 를 감지해 발행하려다 실패합니다)
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- -w --publish always

      - name: Write checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist\Barkan-Launcher-setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "설치 파일을 찾지 못했습니다." }
          $line = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  " + $exe.Name
          Set-Content -Path "dist\SHA256SUMS.txt" -Value $line -Encoding utf8
          Write-Host $line

      # electron-builder 가 올리지 않는 것만 따로 첨부합니다.
      - name: Attach checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release upload $tag "dist\SHA256SUMS.txt" --clobber
          Write-Host "--- 릴리즈 상태 ---"
          gh release view $tag
